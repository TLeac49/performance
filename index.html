<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Focus — Tâches & Rappels</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

    :root {
      --bg: #000;
      --surface: rgba(255,255,255,0.05);
      --surface-hover: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.1);
      --border-focus: rgba(255,255,255,0.3);
      --text: #f5f5f7;
      --text-secondary: rgba(255,255,255,0.45);
      --accent: #0A84FF;
      --accent-hover: #409CFF;
      --danger: #FF453A;
      --warning: #FF9F0A;
      --success: #30D158;
      --radius: 16px;
      --radius-sm: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Background gradient blob */
    body::before {
      content: '';
      position: fixed;
      top: -30vh;
      left: 50%;
      transform: translateX(-50%);
      width: 80vw;
      height: 80vh;
      background: radial-gradient(ellipse at center,
        rgba(10, 132, 255, 0.12) 0%,
        rgba(94, 92, 230, 0.06) 50%,
        transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* NAV */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 64px;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .nav-logo span {
      color: var(--accent);
    }

    .nav-tag {
      font-size: 0.72rem;
      font-weight: 500;
      color: var(--text-secondary);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    /* MAIN */
    main {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 64px 24px 80px;
    }

    /* HERO */
    .hero {
      text-align: center;
      margin-bottom: 64px;
    }

    .hero h1 {
      font-size: clamp(2.4rem, 5vw, 3.6rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.1;
      background: linear-gradient(135deg, #f5f5f7 0%, rgba(245,245,247,0.6) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 16px;
    }

    .hero p {
      font-size: 1.05rem;
      color: var(--text-secondary);
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    /* GRID */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 640px) {
      .grid { grid-template-columns: 1fr; }
      nav { padding: 0 20px; }
      main { padding: 48px 16px 60px; }
    }

    /* PANEL */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: border-color 0.3s;
    }

    .panel:hover {
      border-color: rgba(255,255,255,0.15);
    }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .panel-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .panel-icon.blue  { background: rgba(10,132,255,0.15); }
    .panel-icon.orange { background: rgba(255,159,10,0.15); }

    .panel-title {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    /* INPUTS */
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    input[type="text"],
    input[type="datetime-local"] {
      flex: 1;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 11px 14px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 400;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      -webkit-appearance: none;
    }

    input[type="text"]::placeholder {
      color: var(--text-secondary);
    }

    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: invert(0.5);
      cursor: pointer;
    }

    input:focus {
      border-color: var(--border-focus);
      background: rgba(255,255,255,0.09);
    }

    .btn-add {
      width: 40px;
      height: 40px;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-size: 1.3rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-add:hover { background: var(--accent-hover); }
    .btn-add:active { transform: scale(0.93); }

    /* LIST */
    .item-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 340px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.1) transparent;
    }

    .item-list::-webkit-scrollbar { width: 4px; }
    .item-list::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.1);
      border-radius: 4px;
    }

    /* TASK ITEM */
    .task-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: opacity 0.25s, background 0.2s;
      animation: itemIn 0.25s ease;
    }

    @keyframes itemIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-item:hover { background: rgba(255,255,255,0.09); }

    .task-item.done { opacity: 0.4; }
    .task-item.done .task-text { text-decoration: line-through; }

    /* Custom checkbox */
    .checkbox-wrap {
      position: relative;
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .checkbox-wrap input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
      margin: 0;
    }

    .checkbox-custom {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      border: 1.5px solid rgba(255,255,255,0.2);
      background: transparent;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .checkbox-wrap input:checked ~ .checkbox-custom {
      background: var(--success);
      border-color: var(--success);
    }

    .checkbox-custom::after {
      content: '';
      width: 5px;
      height: 9px;
      border: 2px solid #fff;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) scaleY(0);
      transition: transform 0.15s;
      margin-top: -2px;
    }

    .checkbox-wrap input:checked ~ .checkbox-custom::after {
      transform: rotate(45deg) scaleY(1);
    }

    .task-text {
      flex: 1;
      font-size: 0.875rem;
      font-weight: 400;
      letter-spacing: -0.01em;
    }

    .btn-delete {
      background: none;
      border: none;
      color: rgba(255,255,255,0.2);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
      line-height: 1;
    }

    .btn-delete:hover {
      color: var(--danger);
      background: rgba(255,69,58,0.1);
    }

    /* REMINDER ITEM */
    .reminder-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px 14px;
      background: var(--surface-hover);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      animation: itemIn 0.25s ease;
      transition: background 0.2s;
    }

    .reminder-item:hover { background: rgba(255,255,255,0.09); }

    .reminder-item.triggered {
      border-color: rgba(255,69,58,0.4);
      background: rgba(255,69,58,0.07);
      animation: pulse 1s ease-in-out 3;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.015); }
    }

    .reminder-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--warning);
      margin-top: 5px;
      flex-shrink: 0;
    }

    .reminder-item.triggered .reminder-dot {
      background: var(--danger);
    }

    .reminder-info { flex: 1; }

    .reminder-text {
      font-size: 0.875rem;
      font-weight: 500;
      letter-spacing: -0.01em;
    }

    .reminder-time {
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-top: 3px;
      font-weight: 400;
    }

    /* EMPTY STATE */
    .empty {
      text-align: center;
      color: var(--text-secondary);
      font-size: 0.82rem;
      padding: 28px 0;
      font-weight: 400;
    }

    /* TOAST */
    #toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(30,30,30,0.95);
      color: var(--text);
      padding: 13px 22px;
      border-radius: 50px;
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px var(--border);
      z-index: 999;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1), opacity 0.35s ease;
      opacity: 0;
      white-space: nowrap;
      pointer-events: none;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <nav>
    <div class="nav-logo">Focus<span>.</span></div>
    <div class="nav-tag">Tâches & Rappels</div>
  </nav>

  <main>

    <div class="hero">
      <h1>Organisez votre journée.</h1>
      <p>Simple, rapide, et toujours là où vous en avez besoin.</p>
    </div>

    <div class="grid">

      <!-- TÂCHES -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-icon blue">✓</div>
          <span class="panel-title">Tâches</span>
        </div>

        <div class="input-group">
          <input type="text" id="taskInput" placeholder="Nouvelle tâche…" />
          <button class="btn-add" onclick="addTask()">+</button>
        </div>

        <ul class="item-list" id="taskList">
          <li class="empty" id="taskEmpty">Aucune tâche pour l'instant.</li>
        </ul>
      </div>

      <!-- RAPPELS -->
      <div class="panel">
        <div class="panel-header">
          <div class="panel-icon orange">◎</div>
          <span class="panel-title">Rappels</span>
        </div>

        <div class="input-group">
          <input type="text" id="reminderText" placeholder="Rappel…" />
        </div>
        <div class="input-group">
          <input type="datetime-local" id="reminderTime" />
          <button class="btn-add" onclick="addReminder()">+</button>
        </div>

        <ul class="item-list" id="reminderList">
          <li class="empty" id="reminderEmpty">Aucun rappel pour l'instant.</li>
        </ul>
      </div>

    </div>
  </main>

  <div id="toast"></div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    let reminders = JSON.parse(localStorage.getItem('reminders') || '[]');

    // ---- TÂCHES ----

    function saveTasks() { localStorage.setItem('tasks', JSON.stringify(tasks)); }

    function renderTasks() {
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      if (tasks.length === 0) {
        list.innerHTML = '<li class="empty">Aucune tâche pour l\'instant.</li>';
        return;
      }
      tasks.forEach((task, i) => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');
        li.innerHTML = `
          <label class="checkbox-wrap">
            <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${i})" />
            <div class="checkbox-custom"></div>
          </label>
          <span class="task-text">${escapeHtml(task.text)}</span>
          <button class="btn-delete" onclick="deleteTask(${i})">✕</button>
        `;
        list.appendChild(li);
      });
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ text, done: false });
      saveTasks(); renderTasks();
      input.value = '';
    }

    function toggleTask(i) {
      tasks[i].done = !tasks[i].done;
      saveTasks(); renderTasks();
    }

    function deleteTask(i) {
      tasks.splice(i, 1);
      saveTasks(); renderTasks();
    }

    document.getElementById('taskInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    // ---- RAPPELS ----

    function saveReminders() { localStorage.setItem('reminders', JSON.stringify(reminders)); }

    function renderReminders() {
      const list = document.getElementById('reminderList');
      list.innerHTML = '';
      if (reminders.length === 0) {
        list.innerHTML = '<li class="empty">Aucun rappel pour l\'instant.</li>';
        return;
      }
      reminders.forEach((r, i) => {
        const li = document.createElement('li');
        li.className = 'reminder-item' + (r.triggered ? ' triggered' : '');
        li.id = 'reminder-' + i;
        const date = new Date(r.time);
        li.innerHTML = `
          <div class="reminder-dot"></div>
          <div class="reminder-info">
            <div class="reminder-text">${escapeHtml(r.text)}</div>
            <div class="reminder-time">${formatDate(date)}</div>
          </div>
          <button class="btn-delete" onclick="deleteReminder(${i})">✕</button>
        `;
        list.appendChild(li);
      });
    }

    function addReminder() {
      const text = document.getElementById('reminderText').value.trim();
      const time = document.getElementById('reminderTime').value;
      if (!text || !time) return;
      reminders.push({ text, time, triggered: false });
      saveReminders(); renderReminders();
      document.getElementById('reminderText').value = '';
      document.getElementById('reminderTime').value = '';
    }

    function deleteReminder(i) {
      reminders.splice(i, 1);
      saveReminders(); renderReminders();
    }

    function checkReminders() {
      const now = new Date();
      let changed = false;
      reminders.forEach((r, i) => {
        if (!r.triggered && new Date(r.time) <= now) {
          r.triggered = true;
          changed = true;
          showToast('◎ Rappel : ' + r.text);
          const el = document.getElementById('reminder-' + i);
          if (el) el.classList.add('triggered');
          if (Notification.permission === 'granted') {
            new Notification('Rappel', { body: r.text });
          }
        }
      });
      if (changed) saveReminders();
    }

    function formatDate(d) {
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric' })
        + ' · ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }

    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 4500);
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    if (Notification.permission === 'default') Notification.requestPermission();

    renderTasks();
    renderReminders();
    setInterval(checkReminders, 10000);
    checkReminders();
  </script>

</body>
</html>
