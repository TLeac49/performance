<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tâches & Rappels</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      padding: 30px 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      font-size: 2rem;
      margin-bottom: 30px;
      color: #2c3e50;
    }

    .container {
      display: flex;
      gap: 30px;
      max-width: 1000px;
      margin: 0 auto;
      flex-wrap: wrap;
    }

    .panel {
      background: #fff;
      border-radius: 16px;
      padding: 24px;
      flex: 1;
      min-width: 300px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .panel h2 {
      font-size: 1.2rem;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #2c3e50;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input[type="text"],
    input[type="datetime-local"] {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #ddd;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #6c63ff;
    }

    button.add-btn {
      background: #6c63ff;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 1.2rem;
      transition: background 0.2s;
    }

    button.add-btn:hover {
      background: #574fd6;
    }

    .reminder-inputs {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 16px;
    }

    .reminder-inputs .input-row {
      margin-bottom: 0;
    }

    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* --- TÂCHES --- */
    .task-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #f8f8ff;
      border-radius: 10px;
      border: 1.5px solid #eee;
      transition: opacity 0.2s;
    }

    .task-item.done {
      opacity: 0.5;
    }

    .task-item.done .task-text {
      text-decoration: line-through;
    }

    .task-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6c63ff;
      cursor: pointer;
    }

    .task-text {
      flex: 1;
      font-size: 0.95rem;
    }

    .delete-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 1.1rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .delete-btn:hover {
      color: #e74c3c;
    }

    /* --- RAPPELS --- */
    .reminder-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 14px;
      background: #fff8f0;
      border-radius: 10px;
      border: 1.5px solid #ffe0b2;
    }

    .reminder-item.triggered {
      background: #fdecea;
      border-color: #e74c3c;
      animation: pulse 1s ease-in-out 3;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    .reminder-info {
      flex: 1;
    }

    .reminder-text {
      font-size: 0.95rem;
      font-weight: 500;
    }

    .reminder-time {
      font-size: 0.78rem;
      color: #999;
      margin-top: 2px;
    }

    .empty {
      text-align: center;
      color: #bbb;
      font-size: 0.9rem;
      padding: 20px 0;
    }

    /* Notification toast */
    #toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: #2c3e50;
      color: white;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 0.95rem;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      display: none;
      z-index: 999;
      max-width: 300px;
    }

    #toast.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>Tâches & Rappels</h1>

  <div class="container">

    <!-- LISTE DE TÂCHES -->
    <div class="panel">
      <h2>📋 Liste de tâches</h2>
      <div class="input-row">
        <input type="text" id="taskInput" placeholder="Nouvelle tâche..." />
        <button class="add-btn" onclick="addTask()">+</button>
      </div>
      <ul id="taskList">
        <li class="empty" id="taskEmpty">Aucune tâche pour l'instant.</li>
      </ul>
    </div>

    <!-- RAPPELS -->
    <div class="panel">
      <h2>🔔 Rappels</h2>
      <div class="reminder-inputs">
        <div class="input-row">
          <input type="text" id="reminderText" placeholder="Rappel..." />
        </div>
        <div class="input-row">
          <input type="datetime-local" id="reminderTime" />
          <button class="add-btn" onclick="addReminder()">+</button>
        </div>
      </div>
      <ul id="reminderList">
        <li class="empty" id="reminderEmpty">Aucun rappel pour l'instant.</li>
      </ul>
    </div>

  </div>

  <div id="toast"></div>

  <script>
    let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
    let reminders = JSON.parse(localStorage.getItem('reminders') || '[]');

    // ---- TÂCHES ----

    function saveTasks() {
      localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    function renderTasks() {
      const list = document.getElementById('taskList');
      const empty = document.getElementById('taskEmpty');
      list.innerHTML = '';
      if (tasks.length === 0) {
        list.appendChild(empty);
        return;
      }
      tasks.forEach((task, i) => {
        const li = document.createElement('li');
        li.className = 'task-item' + (task.done ? ' done' : '');
        li.innerHTML = `
          <input type="checkbox" ${task.done ? 'checked' : ''} onchange="toggleTask(${i})" />
          <span class="task-text">${escapeHtml(task.text)}</span>
          <button class="delete-btn" onclick="deleteTask(${i})">✕</button>
        `;
        list.appendChild(li);
      });
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();
      if (!text) return;
      tasks.push({ text, done: false });
      saveTasks();
      renderTasks();
      input.value = '';
    }

    function toggleTask(i) {
      tasks[i].done = !tasks[i].done;
      saveTasks();
      renderTasks();
    }

    function deleteTask(i) {
      tasks.splice(i, 1);
      saveTasks();
      renderTasks();
    }

    document.getElementById('taskInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTask();
    });

    // ---- RAPPELS ----

    function saveReminders() {
      localStorage.setItem('reminders', JSON.stringify(reminders));
    }

    function renderReminders() {
      const list = document.getElementById('reminderList');
      const empty = document.getElementById('reminderEmpty');
      list.innerHTML = '';
      if (reminders.length === 0) {
        list.appendChild(empty);
        return;
      }
      reminders.forEach((r, i) => {
        const li = document.createElement('li');
        li.className = 'reminder-item' + (r.triggered ? ' triggered' : '');
        li.id = 'reminder-' + i;
        const date = new Date(r.time);
        li.innerHTML = `
          <div class="reminder-info">
            <div class="reminder-text">${escapeHtml(r.text)}</div>
            <div class="reminder-time">${formatDate(date)}</div>
          </div>
          <button class="delete-btn" onclick="deleteReminder(${i})">✕</button>
        `;
        list.appendChild(li);
      });
    }

    function addReminder() {
      const text = document.getElementById('reminderText').value.trim();
      const time = document.getElementById('reminderTime').value;
      if (!text || !time) return;
      reminders.push({ text, time, triggered: false });
      saveReminders();
      renderReminders();
      document.getElementById('reminderText').value = '';
      document.getElementById('reminderTime').value = '';
    }

    function deleteReminder(i) {
      reminders.splice(i, 1);
      saveReminders();
      renderReminders();
    }

    function checkReminders() {
      const now = new Date();
      let changed = false;
      reminders.forEach((r, i) => {
        if (!r.triggered && new Date(r.time) <= now) {
          r.triggered = true;
          changed = true;
          showToast('🔔 Rappel : ' + r.text);
          const el = document.getElementById('reminder-' + i);
          if (el) el.classList.add('triggered');
          if (Notification.permission === 'granted') {
            new Notification('Rappel', { body: r.text });
          }
        }
      });
      if (changed) saveReminders();
    }

    function formatDate(d) {
      return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' })
        + ' à ' + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
    }

    // ---- TOAST ----

    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 5000);
    }

    // ---- UTILS ----

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ---- INIT ----

    if (Notification.permission === 'default') {
      Notification.requestPermission();
    }

    renderTasks();
    renderReminders();
    setInterval(checkReminders, 10000);
    checkReminders();
  </script>

</body>
</html>
